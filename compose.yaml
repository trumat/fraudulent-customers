services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        ports:
            - '8000:8000'
        environment:
            PHP_CLI_SERVER_WORKERS: 4
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - .:/var/www/html

    vite:
        build:
            context: .
            dockerfile: docker/node/Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        ports:
            - '5173:5173'
        volumes:
            - .:/var/www/html
            - node_modules:/var/www/html/node_modules

volumes:
    node_modules:
